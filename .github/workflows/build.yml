name: agent-env - check upstream versions & rebuild
# Run title in the Actions list: scheduled/manual runs would otherwise show
# whatever commit is latest on main. Empty (push) = GitHub's default (the commit subject).
run-name: ${{ github.event_name == 'schedule' && 'Scheduled check' || github.event_name == 'workflow_dispatch' && 'Manual run' || '' }}

on:
  schedule:
    # daily at 04:15 -- claude/opencode ship often (and herdr too), so a daily
    # check keeps the sandbox tools from drifting a full day unnoticed.
    - cron: '15 4 * * *'
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      # Only what goes into (or gates) the image -- not the README,
      # .env.sample or the version file (CI's own bump commit would
      # otherwise trigger a second, identical rebuild).
      - docker/**
      - .trivyignore
      - .github/workflows/build.yml

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/linuxrrze/agent-env
  VERSION_FILE: .agent-env-version
  # Digest of the base image the last build used (see 'Check base image digest').
  BASE_DIGEST_FILE: .agent-env-base-digest
  ENV_FILE: .env.sample

permissions:
  contents: write   # "Record built version" pushes the version/digest bump
  packages: write   # push to ghcr.io

# One run at a time: the per-arch staging tags (latest-amd64/latest-arm64)
# are shared, and a second run must not re-point them while the first one
# is still assembling its multi-arch tags from them.
concurrency:
  group: agent-env-build
  cancel-in-progress: false

jobs:
  # Upstream versions + base digest, once for both architectures.
  check:
    runs-on: ubuntu-latest
    outputs:
      claude: ${{ steps.check.outputs.claude }}
      opencode: ${{ steps.check.outputs.opencode }}
      herdr: ${{ steps.check.outputs.herdr }}
      herdr-studio: ${{ steps.check.outputs.herdr-studio }}
      glab: ${{ steps.check.outputs.glab }}
      tea: ${{ steps.check.outputs.tea }}
      hadolint: ${{ steps.check.outputs.hadolint }}
      yq: ${{ steps.check.outputs.yq }}
      uv: ${{ steps.check.outputs.uv }}
      playwright-mcp: ${{ steps.check.outputs.playwright-mcp }}
      node: ${{ steps.check.outputs.node }}
      npm: ${{ steps.check.outputs.npm }}
      tag: ${{ steps.check.outputs.tag }}
      claude_prev: ${{ steps.check.outputs.claude_prev }}
      opencode_prev: ${{ steps.check.outputs.opencode_prev }}
      herdr_prev: ${{ steps.check.outputs.herdr_prev }}
      herdr-studio_prev: ${{ steps.check.outputs.herdr-studio_prev }}
      glab_prev: ${{ steps.check.outputs.glab_prev }}
      tea_prev: ${{ steps.check.outputs.tea_prev }}
      hadolint_prev: ${{ steps.check.outputs.hadolint_prev }}
      yq_prev: ${{ steps.check.outputs.yq_prev }}
      uv_prev: ${{ steps.check.outputs.uv_prev }}
      playwright-mcp_prev: ${{ steps.check.outputs.playwright-mcp_prev }}
      changed: ${{ steps.check.outputs.changed }}
      digest: ${{ steps.base.outputs.digest }}
      build: ${{ steps.decide.outputs.build }}
      date: ${{ steps.decide.outputs.date }}
    steps:
      - uses: actions/checkout@v5

      - name: Determine latest claude + opencode + herdr + herdr-studio + glab + tea + hadolint + yq + uv + playwright-mcp versions
        id: check
        env:
          # api.github.com: authenticated calls get 1000/h per repo instead of
          # the 60/h anonymous limit shared by every job on the runner's IP.
          GH_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh_api() { curl -sfL -H "Authorization: Bearer $GH_API_TOKEN" "https://api.github.com/$1"; }
          command -v jq >/dev/null || (apt-get update -qq && apt-get install -y -qq jq)

          # --- fetch latest upstream versions ------------------------------
          # claude + opencode come from npm (`/latest` subresource -> small
          # JSON); herdr and herdr-studio are binaries released on GitHub
          # (semver tags).
          # No `head`/early-`exit` in any pipe, so nothing can SIGPIPE under
          # `pipefail`.
          CLAUDE_LATEST=$(curl -sf https://registry.npmjs.org/@anthropic-ai/claude-code/latest | jq -r .version)
          OPENCODE_LATEST=$(curl -sf https://registry.npmjs.org/opencode-ai/latest | jq -r .version)
          HERDR_LATEST=$(gh_api repos/herdrdev/herdr/releases/latest | jq -r .tag_name)
          HERDR_LATEST=${HERDR_LATEST#v}   # strip the leading 'v' from the tag
          # herdr-studio was renamed to roamgate upstream (repo powerfooI/roamgate);
          # -L follows GitHub's 301 so a future rename can't break this check.
          HERDR_STUDIO_LATEST=$(gh_api repos/powerfooI/roamgate/releases/latest | jq -r .tag_name)
          HERDR_STUDIO_LATEST=${HERDR_STUDIO_LATEST#v}   # strip the leading 'v'
          # glab (GitLab CLI) releases on gitlab.com: permalink/latest answers
          # with a redirect to the newest release, hence -L.
          GLAB_LATEST=$(curl -sfL https://gitlab.com/api/v4/projects/gitlab-org%2Fcli/releases/permalink/latest | jq -r .tag_name)
          GLAB_LATEST=${GLAB_LATEST#v}
          # tea (Gitea CLI) releases on gitea.com (Gitea API, GitHub-compatible shape).
          TEA_LATEST=$(curl -sf https://gitea.com/api/v1/repos/gitea/tea/releases/latest | jq -r .tag_name)
          TEA_LATEST=${TEA_LATEST#v}
          # hadolint, yq (mikefarah) and uv: GitHub releases (uv's tags carry
          # no leading 'v'; the strip is a no-op there).
          HADOLINT_LATEST=$(gh_api repos/hadolint/hadolint/releases/latest | jq -r .tag_name)
          HADOLINT_LATEST=${HADOLINT_LATEST#v}
          YQ_LATEST=$(gh_api repos/mikefarah/yq/releases/latest | jq -r .tag_name)
          YQ_LATEST=${YQ_LATEST#v}
          UV_LATEST=$(gh_api repos/astral-sh/uv/releases/latest | jq -r .tag_name)
          UV_LATEST=${UV_LATEST#v}
          # @playwright/mcp on npm; the Dockerfile derives the matching
          # `playwright` version from it, so this one pin covers both.
          PLAYWRIGHT_MCP_LATEST=$(curl -sf https://registry.npmjs.org/@playwright/mcp/latest | jq -r .version)

          for v in "claude:$CLAUDE_LATEST" "opencode:$OPENCODE_LATEST" "herdr:$HERDR_LATEST" "herdr-studio:$HERDR_STUDIO_LATEST" "glab:$GLAB_LATEST" "tea:$TEA_LATEST" \
            "hadolint:$HADOLINT_LATEST" "yq:$YQ_LATEST" "uv:$UV_LATEST" "playwright-mcp:$PLAYWRIGHT_MCP_LATEST"; do
            name="${v%%:*}"; ver="${v#*:}"
            if [ -z "$ver" ] || [ "$ver" = "null" ]; then
              echo "::error::could not determine latest $name version" >&2
              exit 1
            fi
          done

          # --- compare to what's currently tracked -------------------------
          # awk drains the file to EOF (no early exit, no pipe) -- the
          # recommended extraction pattern for this repo.
          CLAUDE_CURRENT=$(awk -F= '$1=="claude"{print $2}' "$VERSION_FILE" 2>/dev/null);  CLAUDE_CURRENT=${CLAUDE_CURRENT:-none}
          OPENCODE_CURRENT=$(awk -F= '$1=="opencode"{print $2}' "$VERSION_FILE" 2>/dev/null); OPENCODE_CURRENT=${OPENCODE_CURRENT:-none}
          HERDR_CURRENT=$(awk -F= '$1=="herdr"{print $2}' "$VERSION_FILE" 2>/dev/null);  HERDR_CURRENT=${HERDR_CURRENT:-none}
          HERDR_STUDIO_CURRENT=$(awk -F= '$1=="herdr-studio"{print $2}' "$VERSION_FILE" 2>/dev/null); HERDR_STUDIO_CURRENT=${HERDR_STUDIO_CURRENT:-none}
          GLAB_CURRENT=$(awk -F= '$1=="glab"{print $2}' "$VERSION_FILE" 2>/dev/null); GLAB_CURRENT=${GLAB_CURRENT:-none}
          TEA_CURRENT=$(awk -F= '$1=="tea"{print $2}' "$VERSION_FILE" 2>/dev/null); TEA_CURRENT=${TEA_CURRENT:-none}
          HADOLINT_CURRENT=$(awk -F= '$1=="hadolint"{print $2}' "$VERSION_FILE" 2>/dev/null); HADOLINT_CURRENT=${HADOLINT_CURRENT:-none}
          YQ_CURRENT=$(awk -F= '$1=="yq"{print $2}' "$VERSION_FILE" 2>/dev/null); YQ_CURRENT=${YQ_CURRENT:-none}
          UV_CURRENT=$(awk -F= '$1=="uv"{print $2}' "$VERSION_FILE" 2>/dev/null); UV_CURRENT=${UV_CURRENT:-none}
          PLAYWRIGHT_MCP_CURRENT=$(awk -F= '$1=="playwright-mcp"{print $2}' "$VERSION_FILE" 2>/dev/null); PLAYWRIGHT_MCP_CURRENT=${PLAYWRIGHT_MCP_CURRENT:-none}

          # --- docker tag: <claude>-<opencode>-<herdr>-<herdr-studio> ------
          # Docker tags can't contain ':' or '+' -- sanitize the semver parts
          # (all versions are clean semver, so this is normally a no-op).
          CLAUDE_TAG=$(echo "$CLAUDE_LATEST" | sed 's/^[0-9]\+://' | tr '+' '-')
          OPENCODE_TAG=$(echo "$OPENCODE_LATEST" | sed 's/^[0-9]\+://' | tr '+' '-')
          HERDR_TAG=$(echo "$HERDR_LATEST" | sed 's/^[0-9]\+://' | tr '+' '-')
          HERDR_STUDIO_TAG=$(echo "$HERDR_STUDIO_LATEST" | sed 's/^[0-9]\+://' | tr '+' '-')
          # glab/tea/hadolint/yq/uv/playwright-mcp are deliberately NOT part of
          # the tag (it would grow to ten versions); a bump of only those re-publishes the
          # same tag, and the
          # dated tag from the push step keeps the previous build pullable.
          TAG="${CLAUDE_TAG}-${OPENCODE_TAG}-${HERDR_TAG}-${HERDR_STUDIO_TAG}"

          # NODE_VERSION / NPM_VERSION are manual pins in .env.sample (not
          # CI-tracked) -- honor them so a local Node/npm bump isn't silently
          # ignored when a tool update triggers this build.
          NODE_VERSION=$(awk -F= '$1=="NODE_VERSION"{print $2}' "$ENV_FILE" 2>/dev/null); NODE_VERSION=${NODE_VERSION:-24.20.0}
          NPM_VERSION=$(awk -F= '$1=="NPM_VERSION"{print $2}' "$ENV_FILE" 2>/dev/null); NPM_VERSION=${NPM_VERSION:-11.21.2}

          echo "claude:      current=$CLAUDE_CURRENT   latest=$CLAUDE_LATEST"
          echo "opencode:    current=$OPENCODE_CURRENT latest=$OPENCODE_LATEST"
          echo "herdr:       current=$HERDR_CURRENT    latest=$HERDR_LATEST"
          echo "herdr-studio: current=$HERDR_STUDIO_CURRENT   latest=$HERDR_STUDIO_LATEST"
          echo "glab:        current=$GLAB_CURRENT   latest=$GLAB_LATEST"
          echo "tea:         current=$TEA_CURRENT   latest=$TEA_LATEST"
          echo "hadolint:    current=$HADOLINT_CURRENT   latest=$HADOLINT_LATEST"
          echo "yq:          current=$YQ_CURRENT   latest=$YQ_LATEST"
          echo "uv:          current=$UV_CURRENT   latest=$UV_LATEST"
          echo "playwright-mcp: current=$PLAYWRIGHT_MCP_CURRENT   latest=$PLAYWRIGHT_MCP_LATEST"
          echo "node:        $NODE_VERSION"
          echo "npm:         $NPM_VERSION"
          echo "tag=$TAG"

          echo "claude=$CLAUDE_LATEST" >> "$GITHUB_OUTPUT"
          echo "opencode=$OPENCODE_LATEST" >> "$GITHUB_OUTPUT"
          echo "herdr=$HERDR_LATEST" >> "$GITHUB_OUTPUT"
          echo "herdr-studio=$HERDR_STUDIO_LATEST" >> "$GITHUB_OUTPUT"
          echo "glab=$GLAB_LATEST" >> "$GITHUB_OUTPUT"
          echo "tea=$TEA_LATEST" >> "$GITHUB_OUTPUT"
          echo "hadolint=$HADOLINT_LATEST" >> "$GITHUB_OUTPUT"
          echo "yq=$YQ_LATEST" >> "$GITHUB_OUTPUT"
          echo "uv=$UV_LATEST" >> "$GITHUB_OUTPUT"
          echo "playwright-mcp=$PLAYWRIGHT_MCP_LATEST" >> "$GITHUB_OUTPUT"
          echo "node=$NODE_VERSION" >> "$GITHUB_OUTPUT"
          echo "npm=$NPM_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          # previous versions, used to build a verbose commit message below
          echo "claude_prev=$CLAUDE_CURRENT" >> "$GITHUB_OUTPUT"
          echo "opencode_prev=$OPENCODE_CURRENT" >> "$GITHUB_OUTPUT"
          echo "herdr_prev=$HERDR_CURRENT" >> "$GITHUB_OUTPUT"
          echo "herdr-studio_prev=$HERDR_STUDIO_CURRENT" >> "$GITHUB_OUTPUT"
          echo "glab_prev=$GLAB_CURRENT" >> "$GITHUB_OUTPUT"
          echo "tea_prev=$TEA_CURRENT" >> "$GITHUB_OUTPUT"
          echo "hadolint_prev=$HADOLINT_CURRENT" >> "$GITHUB_OUTPUT"
          echo "yq_prev=$YQ_CURRENT" >> "$GITHUB_OUTPUT"
          echo "uv_prev=$UV_CURRENT" >> "$GITHUB_OUTPUT"
          echo "playwright-mcp_prev=$PLAYWRIGHT_MCP_CURRENT" >> "$GITHUB_OUTPUT"
          if [ "$CLAUDE_LATEST" != "$CLAUDE_CURRENT" ] || [ "$OPENCODE_LATEST" != "$OPENCODE_CURRENT" ] || [ "$HERDR_LATEST" != "$HERDR_CURRENT" ] || [ "$HERDR_STUDIO_LATEST" != "$HERDR_STUDIO_CURRENT" ] \
            || [ "$GLAB_LATEST" != "$GLAB_CURRENT" ] || [ "$TEA_LATEST" != "$TEA_CURRENT" ] \
            || [ "$HADOLINT_LATEST" != "$HADOLINT_CURRENT" ] || [ "$YQ_LATEST" != "$YQ_CURRENT" ] || [ "$UV_LATEST" != "$UV_CURRENT" ] \
            || [ "$PLAYWRIGHT_MCP_LATEST" != "$PLAYWRIGHT_MCP_CURRENT" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      # Also rebuild when the base image is re-published under the same tag
      # (OS security updates in the base), not only when the tracked version
      # moves -- otherwise the image only picks those up by chance.
      - name: Check base image digest
        id: base
        run: |
          set -euo pipefail
          DIGEST=$(bash .github/scripts/base-digest.sh docker/Dockerfile)
          CURRENT=$(cat "$BASE_DIGEST_FILE" 2>/dev/null || echo none)
          echo "base image: current=$CURRENT latest=$DIGEST"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          if [ "$DIGEST" != "$CURRENT" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      # Build on a version change, and also on push / manual dispatch (so
      # editing the Dockerfile/entrypoint always rebuilds) -- only the nightly
      # cron skips when nothing upstream changed. The date is fixed here so
      # both architectures (and the dated tag) use the same day even if the
      # run crosses midnight.
      - name: Decide whether to build
        id: decide
        run: |
          if [ "${{ github.event_name }}" != schedule ] || [ "${{ steps.check.outputs.changed }}" = true ] || [ "${{ steps.base.outputs.changed }}" = true ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi
          echo "date=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

  # Native build per architecture (no QEMU: the npm installs and the
  # Playwright smoke test would crawl under emulation). Each leg builds,
  # adds the banner, Trivy-scans its own image and pushes it as the moving
  # staging tag latest-<arch>; the publish job assembles the multi-arch tags.
  build:
    needs: check
    if: needs.check.outputs.build == 'true'
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm   # free for public repos
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5

      - name: Build image
        run: |
          # --no-cache: --pull only refreshes the base layer. With an
          # unchanged base digest the cached apt layer (update/dist-upgrade/
          # install) would be reused, so archive security fixes for packages
          # not in the base would never land.
          docker build --pull --no-cache \
            --build-arg APT_REFRESH="${{ needs.check.outputs.date }}" \
            --build-arg NODE_VERSION="${{ needs.check.outputs.node }}" \
            --build-arg NPM_VERSION="${{ needs.check.outputs.npm }}" \
            --build-arg CLAUDE_VERSION="${{ needs.check.outputs.claude }}" \
            --build-arg OPENCODE_VERSION="${{ needs.check.outputs.opencode }}" \
            --build-arg HERDR_VERSION="${{ needs.check.outputs.herdr }}" \
            --build-arg HERDR_STUDIO_VERSION="${{ needs.check.outputs.herdr-studio }}" \
            --build-arg GLAB_VERSION="${{ needs.check.outputs.glab }}" \
            --build-arg TEA_VERSION="${{ needs.check.outputs.tea }}" \
            --build-arg HADOLINT_VERSION="${{ needs.check.outputs.hadolint }}" \
            --build-arg YQ_VERSION="${{ needs.check.outputs.yq }}" \
            --build-arg UV_VERSION="${{ needs.check.outputs.uv }}" \
            --build-arg PLAYWRIGHT_MCP_VERSION="${{ needs.check.outputs.playwright-mcp }}" \
            -t "$IMAGE:${{ needs.check.outputs.tag }}" \
            -t "$IMAGE:latest-${{ matrix.arch }}" \
            --label org.opencontainers.image.source=https://github.com/linuxrrze/agent-env \
            docker

      # Startup banner (image name + version, figlet style) as a thin layer
      # on top of the built image, same tags -- see .github/scripts/add-banner.sh.
      # The first tag gives the banner text (the version tag, not latest-<arch>).
      - name: Add startup banner
        run: |
          bash .github/scripts/add-banner.sh \
            "$IMAGE:${{ needs.check.outputs.tag }}" \
            "$IMAGE:latest-${{ matrix.arch }}"

      # Fail the publish on a fixable CRITICAL/HIGH CVE (OS packages + the
      # bundled npm/python deps + the herdr / roamgate / gh / glab / tea / hadolint / yq / uv binaries + the Playwright npm packages
      # and Chromium's apt libs -- not Playwright's downloaded Chromium itself,
      # which Trivy can't see). Lower
      # severities and CVEs with no available fix are
      # reported but don't block. To relax:
      # drop `--exit-code 1` (report-only) or narrow `--severity`.
      #
      # Known, deliberately-accepted exceptions (re-check and remove as the
      # upstreams land fixes):
      # - SSH host keys: generated at build time on purpose as a fallback/seed
      #   for /var/lib/ssh-keys (stable host-key fingerprint when the dir is
      #   not bind-mounted; see Dockerfile + docker-compose.yml.sample) -- the
      #   private host keys are the expected content of an SSH-server image,
      #   not a leak. The '**/ssh_host_*_key' glob matches them at the new path.
      # - npm's bundled deps (undici, tar, brace-expansion, ...) are not
      #   ignored: the image replaces Node's npm with the NPM_VERSION pin
      #   (.env.sample) -- bump that when the scan flags them.
      - name: Security scan (Trivy)
        run: |
          set -euo pipefail
          bash .github/scripts/trivy-scan.sh "$IMAGE:latest-${{ matrix.arch }}" \
            --skip-files '**/ssh_host_*_key' \
            --ignorefile .trivyignore

      - name: Push staging tag
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$REGISTRY_PASSWORD" | docker login "$REGISTRY" \
            -u "$REGISTRY_USER" --password-stdin
          docker push "$IMAGE:latest-${{ matrix.arch }}"

  # Both architectures built and scanned clean: publish the multi-arch tags,
  # then record the versions.
  publish:
    needs: [check, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Push multi-arch image
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$REGISTRY_PASSWORD" | docker login "$REGISTRY" \
            -u "$REGISTRY_USER" --password-stdin
          # Version tag, dated tag and latest all point at one manifest list
          # (amd64 + arm64). The dated tag next to the moving version tag: a
          # rebuild (push, base update) re-publishes the same version tag,
          # this keeps the previous build pullable for a rollback.
          TAG="${{ needs.check.outputs.tag }}"
          docker buildx imagetools create \
            --annotation "index:org.opencontainers.image.source=https://github.com/linuxrrze/agent-env" \
            -t "$IMAGE:$TAG" \
            -t "$IMAGE:$TAG-${{ needs.check.outputs.date }}" \
            -t "$IMAGE:latest" \
            "$IMAGE:latest-amd64" "$IMAGE:latest-arm64"
          docker buildx imagetools inspect "$IMAGE:latest"

      - name: Record built version
        run: |
          {
            echo "claude=${{ needs.check.outputs.claude }}"
            echo "opencode=${{ needs.check.outputs.opencode }}"
            echo "herdr=${{ needs.check.outputs.herdr }}"
            echo "herdr-studio=${{ needs.check.outputs.herdr-studio }}"
            echo "glab=${{ needs.check.outputs.glab }}"
            echo "tea=${{ needs.check.outputs.tea }}"
            echo "hadolint=${{ needs.check.outputs.hadolint }}"
            echo "yq=${{ needs.check.outputs.yq }}"
            echo "uv=${{ needs.check.outputs.uv }}"
            echo "playwright-mcp=${{ needs.check.outputs.playwright-mcp }}"
          } > "$VERSION_FILE"
          echo "${{ needs.check.outputs.digest }}" > "$BASE_DIGEST_FILE"
          # keep .env.sample (template for the local .env) in sync
          sed -i "s/^CLAUDE_VERSION=.*/CLAUDE_VERSION=${{ needs.check.outputs.claude }}/" "$ENV_FILE"
          sed -i "s/^OPENCODE_VERSION=.*/OPENCODE_VERSION=${{ needs.check.outputs.opencode }}/" "$ENV_FILE"
          sed -i "s/^HERDR_VERSION=.*/HERDR_VERSION=${{ needs.check.outputs.herdr }}/" "$ENV_FILE"
          sed -i "s/^HERDR_STUDIO_VERSION=.*/HERDR_STUDIO_VERSION=${{ needs.check.outputs.herdr-studio }}/" "$ENV_FILE"
          sed -i "s/^GLAB_VERSION=.*/GLAB_VERSION=${{ needs.check.outputs.glab }}/" "$ENV_FILE"
          sed -i "s/^TEA_VERSION=.*/TEA_VERSION=${{ needs.check.outputs.tea }}/" "$ENV_FILE"
          sed -i "s/^HADOLINT_VERSION=.*/HADOLINT_VERSION=${{ needs.check.outputs.hadolint }}/" "$ENV_FILE"
          sed -i "s/^YQ_VERSION=.*/YQ_VERSION=${{ needs.check.outputs.yq }}/" "$ENV_FILE"
          sed -i "s/^UV_VERSION=.*/UV_VERSION=${{ needs.check.outputs.uv }}/" "$ENV_FILE"
          sed -i "s/^PLAYWRIGHT_MCP_VERSION=.*/PLAYWRIGHT_MCP_VERSION=${{ needs.check.outputs.playwright-mcp }}/" "$ENV_FILE"
          git add "$VERSION_FILE" "$BASE_DIGEST_FILE" "$ENV_FILE"
          # A push-triggered rebuild with no upstream change writes identical
          # content -- only commit/push when a version actually moved.
          if git diff --cached --quiet; then
            echo "no version change to record"
            exit 0
          fi
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          # Multi-line message with embedded values -> temp file + `commit -F`,
          # per the repo convention (avoids -m quoting pitfalls).
          MSG="$(mktemp)"
          {
            echo "agent-env: bump tracked tool versions to claude=${{ needs.check.outputs.claude }} opencode=${{ needs.check.outputs.opencode }} herdr=${{ needs.check.outputs.herdr }} herdr-studio=${{ needs.check.outputs.herdr-studio }} glab=${{ needs.check.outputs.glab }} tea=${{ needs.check.outputs.tea }} hadolint=${{ needs.check.outputs.hadolint }} yq=${{ needs.check.outputs.yq }} uv=${{ needs.check.outputs.uv }} playwright-mcp=${{ needs.check.outputs.playwright-mcp }}"
            echo
            echo "CI detected new upstream releases of the preinstalled dev"
            echo "tools and rebuilt the image against them:"
            echo "  - @anthropic-ai/claude-code: ${{ needs.check.outputs.claude_prev }} -> ${{ needs.check.outputs.claude }}"
            echo "  - opencode-ai:               ${{ needs.check.outputs.opencode_prev }} -> ${{ needs.check.outputs.opencode }}"
            echo "  - herdr (GitHub release):    ${{ needs.check.outputs.herdr_prev }} -> ${{ needs.check.outputs.herdr }}"
            echo "  - herdr-studio (GitHub release): ${{ needs.check.outputs.herdr-studio_prev }} -> ${{ needs.check.outputs.herdr-studio }}"
            echo "  - glab (GitLab release):     ${{ needs.check.outputs.glab_prev }} -> ${{ needs.check.outputs.glab }}"
            echo "  - tea (Gitea release):       ${{ needs.check.outputs.tea_prev }} -> ${{ needs.check.outputs.tea }}"
            echo "  - hadolint (GitHub release): ${{ needs.check.outputs.hadolint_prev }} -> ${{ needs.check.outputs.hadolint }}"
            echo "  - yq (GitHub release):       ${{ needs.check.outputs.yq_prev }} -> ${{ needs.check.outputs.yq }}"
            echo "  - uv (GitHub release):       ${{ needs.check.outputs.uv_prev }} -> ${{ needs.check.outputs.uv }}"
            echo "  - @playwright/mcp (npm):     ${{ needs.check.outputs.playwright-mcp_prev }} -> ${{ needs.check.outputs.playwright-mcp }}"
            echo
            echo "Rebuilt, Trivy-scanned (no fixable critical/high CVEs), and"
            echo "pushed $IMAGE:${{ needs.check.outputs.tag }} and $IMAGE:latest (amd64 + arm64)."
          } > "$MSG"
          # No tool moved -- this rebuild was triggered by a new base image only.
          if [ "${{ needs.check.outputs.changed }}" != true ]; then
            echo "agent-env: rebuild on updated base image ${{ needs.check.outputs.digest }}" > "$MSG"
          fi
          git commit -F "$MSG"
          rm -f "$MSG"
          # Other workflows in this repo can push their own version-bump
          # commits around the same time -- retry with rebase on a
          # non-fast-forward push instead of failing outright.
          for attempt in 1 2 3 4 5; do
            if git push; then
              break
            fi
            if [ "$attempt" = 5 ]; then
              echo "::error::failed to push after $attempt attempts" >&2
              exit 1
            fi
            sleep $((RANDOM % 5 + 1))
            git fetch origin main
            git rebase origin/main
          done
