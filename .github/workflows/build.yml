# Verifying the auto-update: .codingenv-version was manually decremented to
# force a mismatch and confirm this workflow updates it back on its own.
name: codingenv - check upstream versions & rebuild
# Run title in the Actions list: scheduled/manual runs would otherwise show
# whatever commit is latest on main. Empty (push) = Gitea's default subject.
run-name: ${{ github.event_name == 'schedule' && 'Scheduled check' || github.event_name == 'workflow_dispatch' && 'Manual run' || '' }}

on:
  schedule:
    # daily at 04:15 -- claude/opencode ship often (and herdr too), so a daily
    # check keeps the sandbox tools from drifting a full day unnoticed.
    - cron: '15 4 * * *'
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - codingenv/docker/**
      # .codingenv-version / .env.sample are intentionally excluded -- otherwise CI's
      # own version-bump commit would re-trigger this workflow.
      - .gitea/workflows/codingenv-rebuild.yml

env:
  REGISTRY: git.linux-ng.de
  IMAGE: git.linux-ng.de/marcel/codingenv
  VERSION_FILE: codingenv/.codingenv-version
  ENV_FILE: codingenv/.env.sample

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Determine latest claude + opencode + herdr + herdr-studio versions
        id: check
        run: |
          set -euo pipefail
          command -v jq >/dev/null || (apt-get update -qq && apt-get install -y -qq jq)

          # --- fetch latest upstream versions ------------------------------
          # claude + opencode come from npm (`/latest` subresource -> small
          # JSON); herdr and herdr-studio are binaries released on GitHub
          # (semver tags).
          # No `head`/early-`exit` in any pipe, so nothing can SIGPIPE under
          # `pipefail`.
          CLAUDE_LATEST=$(curl -sf https://registry.npmjs.org/@anthropic-ai/claude-code/latest | jq -r .version)
          OPENCODE_LATEST=$(curl -sf https://registry.npmjs.org/opencode-ai/latest | jq -r .version)
          HERDR_LATEST=$(curl -sf https://api.github.com/repos/herdrdev/herdr/releases/latest | jq -r .tag_name)
          HERDR_LATEST=${HERDR_LATEST#v}   # strip the leading 'v' from the tag
          # herdr-studio was renamed to roamgate upstream (repo powerfooI/roamgate);
          # -L follows GitHub's 301 so a future rename can't break this check.
          HERDR_STUDIO_LATEST=$(curl -sfL https://api.github.com/repos/powerfooI/roamgate/releases/latest | jq -r .tag_name)
          HERDR_STUDIO_LATEST=${HERDR_STUDIO_LATEST#v}   # strip the leading 'v'

          for v in "claude:$CLAUDE_LATEST" "opencode:$OPENCODE_LATEST" "herdr:$HERDR_LATEST" "herdr-studio:$HERDR_STUDIO_LATEST"; do
            name="${v%%:*}"; ver="${v#*:}"
            if [ -z "$ver" ] || [ "$ver" = "null" ]; then
              echo "::error::could not determine latest $name version" >&2
              exit 1
            fi
          done

          # --- compare to what's currently tracked -------------------------
          # awk drains the file to EOF (no early exit, no pipe) -- the
          # recommended extraction pattern for this repo.
          CLAUDE_CURRENT=$(awk -F= '$1=="claude"{print $2}' "$VERSION_FILE" 2>/dev/null);  CLAUDE_CURRENT=${CLAUDE_CURRENT:-none}
          OPENCODE_CURRENT=$(awk -F= '$1=="opencode"{print $2}' "$VERSION_FILE" 2>/dev/null); OPENCODE_CURRENT=${OPENCODE_CURRENT:-none}
          HERDR_CURRENT=$(awk -F= '$1=="herdr"{print $2}' "$VERSION_FILE" 2>/dev/null);  HERDR_CURRENT=${HERDR_CURRENT:-none}
          HERDR_STUDIO_CURRENT=$(awk -F= '$1=="herdr-studio"{print $2}' "$VERSION_FILE" 2>/dev/null); HERDR_STUDIO_CURRENT=${HERDR_STUDIO_CURRENT:-none}

          # --- docker tag: <claude>-<opencode>-<herdr>-<herdr-studio> ------
          # Docker tags can't contain ':' or '+' -- sanitize the semver parts
          # (all versions are clean semver, so this is normally a no-op).
          CLAUDE_TAG=$(echo "$CLAUDE_LATEST" | sed 's/^[0-9]\+://' | tr '+' '-')
          OPENCODE_TAG=$(echo "$OPENCODE_LATEST" | sed 's/^[0-9]\+://' | tr '+' '-')
          HERDR_TAG=$(echo "$HERDR_LATEST" | sed 's/^[0-9]\+://' | tr '+' '-')
          HERDR_STUDIO_TAG=$(echo "$HERDR_STUDIO_LATEST" | sed 's/^[0-9]\+://' | tr '+' '-')
          TAG="${CLAUDE_TAG}-${OPENCODE_TAG}-${HERDR_TAG}-${HERDR_STUDIO_TAG}"

          # NODE_VERSION is a manual pin in .env.sample (not CI-tracked) -- honor it
          # so a local Node bump isn't silently ignored when a tool update
          # triggers this build.
          NODE_VERSION=$(awk -F= '$1=="NODE_VERSION"{print $2}' "$ENV_FILE" 2>/dev/null); NODE_VERSION=${NODE_VERSION:-24.20.0}

          echo "claude:      current=$CLAUDE_CURRENT   latest=$CLAUDE_LATEST"
          echo "opencode:    current=$OPENCODE_CURRENT latest=$OPENCODE_LATEST"
          echo "herdr:       current=$HERDR_CURRENT    latest=$HERDR_LATEST"
          echo "herdr-studio: current=$HERDR_STUDIO_CURRENT   latest=$HERDR_STUDIO_LATEST"
          echo "node:        $NODE_VERSION"
          echo "tag=$TAG"

          echo "claude=$CLAUDE_LATEST" >> "$GITHUB_OUTPUT"
          echo "opencode=$OPENCODE_LATEST" >> "$GITHUB_OUTPUT"
          echo "herdr=$HERDR_LATEST" >> "$GITHUB_OUTPUT"
          echo "herdr-studio=$HERDR_STUDIO_LATEST" >> "$GITHUB_OUTPUT"
          echo "node=$NODE_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          # previous versions, used to build a verbose commit message below
          echo "claude_prev=$CLAUDE_CURRENT" >> "$GITHUB_OUTPUT"
          echo "opencode_prev=$OPENCODE_CURRENT" >> "$GITHUB_OUTPUT"
          echo "herdr_prev=$HERDR_CURRENT" >> "$GITHUB_OUTPUT"
          echo "herdr-studio_prev=$HERDR_STUDIO_CURRENT" >> "$GITHUB_OUTPUT"
          if [ "$CLAUDE_LATEST" != "$CLAUDE_CURRENT" ] || [ "$OPENCODE_LATEST" != "$OPENCODE_CURRENT" ] || [ "$HERDR_LATEST" != "$HERDR_CURRENT" ] || [ "$HERDR_STUDIO_LATEST" != "$HERDR_STUDIO_CURRENT" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      # Build on a version change, and also on push / manual dispatch (so
      # editing the Dockerfile/entrypoint always rebuilds) -- only the nightly
      # cron skips when nothing upstream changed.
      - name: Build image
        if: github.event_name != 'schedule' || steps.check.outputs.changed == 'true'
        run: |
          docker build \
            --build-arg NODE_VERSION="${{ steps.check.outputs.node }}" \
            --build-arg CLAUDE_VERSION="${{ steps.check.outputs.claude }}" \
            --build-arg OPENCODE_VERSION="${{ steps.check.outputs.opencode }}" \
            --build-arg HERDR_VERSION="${{ steps.check.outputs.herdr }}" \
            --build-arg HERDR_STUDIO_VERSION="${{ steps.check.outputs.herdr-studio }}" \
            -t "$IMAGE:${{ steps.check.outputs.tag }}" \
            -t "$IMAGE:latest" \
            codingenv/docker

      # Startup banner (image name + version, figlet style) as a thin layer
      # on top of the built image, same tags -- see .gitea/scripts/add-banner.sh.
      - name: Add startup banner
        if: github.event_name != 'schedule' || steps.check.outputs.changed == 'true'
        run: |
          bash .gitea/scripts/add-banner.sh \
            "$IMAGE:${{ steps.check.outputs.tag }}" \
            "$IMAGE:latest"

      # Fail the publish on a fixable CRITICAL/HIGH CVE (OS packages + the
      # bundled npm/python deps + the herdr + roamgate binaries). Lower
      # severities and CVEs with no available fix are
      # reported but don't block. To relax:
      # drop `--exit-code 1` (report-only) or narrow `--severity`.
      #
      # Known, deliberately-accepted exceptions (re-check and remove as the
      # upstreams land fixes):
      # - SSH host keys: generated at build time on purpose as a fallback/seed
      #   for /var/lib/ssh-keys (stable host-key fingerprint when the dir is
      #   not bind-mounted; see Dockerfile + docker-compose.yml.sample) -- the
      #   private host keys are the expected content of an SSH-server image,
      #   not a leak. The '**/ssh_host_*_key' glob matches them at the new path.
      # - The 4 npm CVEs below: the npm bundled with node 24.20.0 pins
      #   transitive deps (brace-expansion, ip-address, tar) whose fixes are
      #   published (>=5.0.9 / >=10.3.1 / >=7.5.22), but fresh npm installs
      #   are currently broken (@npmcli/docs was unpublished from the
      #   registry) and in-place `npm install -g npm@...` keeps the old
      #   pinned versions. Re-check when a Node release bundles a newer npm;
      #   bump NODE_VERSION in codingenv/.env.sample and drop the entries from
      #   codingenv/.trivyignore.
      - name: Security scan (Trivy)
        if: github.event_name != 'schedule' || steps.check.outputs.changed == 'true'
        run: |
          set -euo pipefail
          # install.sh (godownloader) defaults BINDIR to ./bin, which would
          # land in the workspace root and never end up on PATH -- pin it to
          # $HOME/.local/bin explicitly (exported so the piped `sh` sees it).
          export BINDIR="$HOME/.local/bin"
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s
          export PATH="$BINDIR:$PATH"
          trivy image \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            --exit-code 1 \
            --no-progress \
            --skip-files '**/ssh_host_*_key' \
            --ignorefile codingenv/.trivyignore \
            "$IMAGE:latest"

      - name: Push image
        if: github.event_name != 'schedule' || steps.check.outputs.changed == 'true'
        run: |
          echo "${{ secrets.REGISTRY_PASSWORD }}" | docker login "$REGISTRY" \
            -u "${{ secrets.REGISTRY_USER }}" --password-stdin
          docker push "$IMAGE:${{ steps.check.outputs.tag }}"
          docker push "$IMAGE:latest"

      - name: Record built version
        if: github.event_name != 'schedule' || steps.check.outputs.changed == 'true'
        run: |
          {
            echo "claude=${{ steps.check.outputs.claude }}"
            echo "opencode=${{ steps.check.outputs.opencode }}"
            echo "herdr=${{ steps.check.outputs.herdr }}"
            echo "herdr-studio=${{ steps.check.outputs.herdr-studio }}"
          } > "$VERSION_FILE"
          # keep codingenv/.env.sample (template for the local .env) in sync
          sed -i "s/^CLAUDE_VERSION=.*/CLAUDE_VERSION=${{ steps.check.outputs.claude }}/" "$ENV_FILE"
          sed -i "s/^OPENCODE_VERSION=.*/OPENCODE_VERSION=${{ steps.check.outputs.opencode }}/" "$ENV_FILE"
          sed -i "s/^HERDR_VERSION=.*/HERDR_VERSION=${{ steps.check.outputs.herdr }}/" "$ENV_FILE"
          sed -i "s/^HERDR_STUDIO_VERSION=.*/HERDR_STUDIO_VERSION=${{ steps.check.outputs.herdr-studio }}/" "$ENV_FILE"
          git add "$VERSION_FILE" "$ENV_FILE"
          # A push-triggered rebuild with no upstream change writes identical
          # content -- only commit/push when a version actually moved.
          if git diff --cached --quiet; then
            echo "no version change to record"
            exit 0
          fi
          git config user.email "gitea-actions@linux-ng.de"
          git config user.name "gitea-actions"
          # Multi-line message with embedded values -> temp file + `commit -F`,
          # per the repo convention (avoids -m quoting pitfalls).
          MSG="$(mktemp)"
          {
            echo "codingenv: bump tracked tool versions to claude=${{ steps.check.outputs.claude }} opencode=${{ steps.check.outputs.opencode }} herdr=${{ steps.check.outputs.herdr }} herdr-studio=${{ steps.check.outputs.herdr-studio }}"
            echo
            echo "CI detected new upstream releases of the preinstalled dev"
            echo "tools and rebuilt the image against them:"
            echo "  - @anthropic-ai/claude-code: ${{ steps.check.outputs.claude_prev }} -> ${{ steps.check.outputs.claude }}"
            echo "  - opencode-ai:               ${{ steps.check.outputs.opencode_prev }} -> ${{ steps.check.outputs.opencode }}"
            echo "  - herdr (GitHub release):    ${{ steps.check.outputs.herdr_prev }} -> ${{ steps.check.outputs.herdr }}"
            echo "  - herdr-studio (GitHub release): ${{ steps.check.outputs.herdr-studio_prev }} -> ${{ steps.check.outputs.herdr-studio }}"
            echo
            echo "Rebuilt, Trivy-scanned (no fixable critical/high CVEs), and"
            echo "pushed $IMAGE:${{ steps.check.outputs.tag }} and $IMAGE:latest."
          } > "$MSG"
          git commit -F "$MSG"
          rm -f "$MSG"
          # Other workflows in this repo can push their own version-bump
          # commits around the same time -- retry with rebase on a
          # non-fast-forward push instead of failing outright.
          for attempt in 1 2 3 4 5; do
            if git push; then
              break
            fi
            if [ "$attempt" = 5 ]; then
              echo "::error::failed to push after $attempt attempts" >&2
              exit 1
            fi
            sleep $((RANDOM % 5 + 1))
            git fetch origin main
            git rebase origin/main
          done
